description: 'Blue Bottle Coffee is a specialty coffee roaster and retailer founded in 2002 in Oakland,
  California by James Freeman, known for freshly roasted single-origin beans, seasonal blends, cafes, and
  a direct-to-consumer subscription service that ships coffee within 48 hours of roasting. A majority stake
  was acquired by Nestle in 2017. The company operates cafes across the United States and Asia and sells
  whole-bean coffee, brewing equipment, and gift subscriptions through its e-commerce site. Surfaced as a
  portfolio company of gv, kindred-ventures and true-ventures; no public developer API program has been
  found. Sector: consumer.'
